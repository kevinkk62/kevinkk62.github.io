<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown 21:26 — Spazio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #0d1326 0%, #050711 65%, #020308 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    canvas#space {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Leggera nebulosa soffusa sullo sfondo */
    .nebula {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 30%, rgba(88, 101, 242, 0.12), transparent 55%),
        radial-gradient(ellipse at 78% 68%, rgba(168, 85, 247, 0.10), transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(14, 165, 233, 0.06), transparent 60%);
    }

    .overlay {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .countdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 32px);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(72px, 16vw, 150px);
      padding: clamp(14px, 2.5vw, 26px) clamp(10px, 2vw, 20px);
      border-radius: 20px;
      background: rgba(10, 15, 35, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 0 35px rgba(56, 189, 248, 0.12),
        inset 0 0 20px rgba(255, 255, 255, 0.03);
    }

    .value {
      font-size: clamp(2.4rem, 8vw, 6.2rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 65%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(125, 211, 252, 0.4));
    }

    .unit-label {
      margin-top: 10px;
      font-size: clamp(0.65rem, 1.4vw, 0.85rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.85);
    }

    .separator {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 300;
      color: rgba(186, 230, 253, 0.65);
      transform: translateY(-10px);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .subinfo {
      margin-top: 22px;
      font-size: clamp(0.8rem, 1.8vw, 1rem);
      letter-spacing: 0.12em;
      color: rgba(148, 163, 184, 0.75);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="nebula"></div>

  <main class="overlay">
    <div class="countdown" id="countdownBox" aria-live="polite">
      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="unit-label">Ore</span>
      </div>
      <span class="separator">:</span>
      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="unit-label">Minuti</span>
      </div>
      <span class="separator">:</span>
      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="unit-label">Secondi</span>
      </div>
    </div>

    <div class="subinfo">м♪✺</div>
  </main>

  <script>
    // --- CAMPO STELLARE IN MOVIMENTO (3D STARFIELD) ---
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;

    // Muovi leggermente il centro prospettico col mouse
    let targetOffsetX = 0;
    let targetOffsetY = 0;
    let currentOffsetX = 0;
    let currentOffsetY = 0;

    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      targetOffsetX = nx * 90;
      targetOffsetY = ny * 70;
    });

    const STAR_COUNT = 420;
    const stars = [];
    const starColors = [
      '255, 255, 255',
      '207, 236, 255',
      '255, 244, 214',
      '224, 212, 255'
    ];

    function createStar(randomZ = true) {
      const spread = Math.max(window.innerWidth, window.innerHeight) * 1.4;
      return {
        x: (Math.random() - 0.5) * spread,
        y: (Math.random() - 0.5) * spread,
        z: randomZ ? Math.random() * 1200 + 1 : 1200,
        prevX: null,
        prevY: null,
        size: Math.random() * 1.6 + 0.5,
        speed: Math.random() * 2.2 + 2.4,
        color: starColors[Math.floor(Math.random() * starColors.length)]
      };
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      centerX = width / 2;
      centerY = height / 2;
    }

    function initStars() {
      stars.length = 0;
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(createStar(true));
      }
    }

    function animateSpace() {
      // Leggera scia per dare profondità al movimento
      ctx.fillStyle = 'rgba(4, 6, 15, 0.32)';
      ctx.fillRect(0, 0, width, height);

      currentOffsetX += (targetOffsetX - currentOffsetX) * 0.05;
      currentOffsetY += (targetOffsetY - currentOffsetY) * 0.05;

      const cx = centerX + currentOffsetX;
      const cy = centerY + currentOffsetY;
      const fov = 420;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.z -= s.speed;

        if (s.z <= 1) {
          stars[i] = createStar(false);
          continue;
        }

        const scale = fov / s.z;
        const sx = cx + s.x * scale;
        const sy = cy + s.y * scale;

        // Nascondi stelle fuori schermo
        if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50) {
          stars[i] = createStar(false);
          continue;
        }

        const depthRatio = 1 - s.z / 1200;
        const radius = Math.max(0.3, s.size * scale * 0.65);
        const alpha = Math.min(1, Math.max(0.15, depthRatio * 1.15));

        if (s.prevX !== null && s.prevY !== null) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(${s.color}, ${alpha * 0.55})`;
          ctx.lineWidth = radius * 0.9;
          ctx.lineCap = 'round';
          ctx.moveTo(s.prevX, s.prevY);
          ctx.lineTo(sx, sy);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${s.color}, ${alpha})`;
        ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.fill();

        s.prevX = sx;
        s.prevY = sy;
      }

      requestAnimationFrame(animateSpace);
    }

    // --- COUNTDOWN FISSO: SOLO OGGI ALLE 21:26 ---
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const countdownBox = document.getElementById('countdownBox');

    // Data specifica: 23 novembre 2026, ore 21:26 (ora locale del dispositivo)
    const targetDate = new Date(2026, 10, 23, 21, 26, 0, 0);

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function updateCountdown() {
      const diffMs = Math.max(0, targetDate - new Date());
      const totalSeconds = Math.floor(diffMs / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      hoursEl.textContent = pad2(hours);
      minutesEl.textContent = pad2(minutes);
      secondsEl.textContent = pad2(seconds);
    }

    // Avvio
    resizeCanvas();
    initStars();
    animateSpace();
    updateCountdown();

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
